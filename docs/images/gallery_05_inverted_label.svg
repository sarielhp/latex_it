  <text x="288" y="25" fill="#787c99" text-anchor="middle" class="title">Standard Tool: latexmk</text>
  <g transform="translate(18, 62)" class="code">
    <text x="0" y="0"><tspan fill="#7dcfff" font-weight="bold">$ latexmk -xelatex paper.tex</tspan></text>
        <text x="0" y="20"><tspan fill="#565f89" >Rc files read (in order):</tspan></text>
        <text x="0" y="40"><tspan fill="#c0caf5" >  /etc/LatexMk</tspan></text>
        <text x="0" y="60"><tspan fill="#c0caf5" >  /home/sariel/.latexmkrc</tspan></text>
        <text x="0" y="80"><tspan fill="#565f89" >Latexmk: This is Latexmk, John Collins, 9 March 2026. Version 4.88.</tspan></text>
        <text x="0" y="100"><tspan fill="#c0caf5" >No existing .aux file, so I'll make a simple one, and require run of</tspan></text>
        <text x="0" y="120"><tspan fill="#c0caf5" >    </tspan><tspan fill="#c0caf5" >*latex.</tspan></text>
        <text x="0" y="140"><tspan fill="#565f89" >Latexmk: applying rule 'xelatex'...</tspan></text>
        <text x="0" y="160"><tspan fill="#565f89" >Rule 'xelatex':  Reasons for rerun</tspan></text>
        <text x="0" y="180"><tspan fill="#565f89" >Category 'other':</tspan></text>
        <text x="0" y="200"><tspan fill="#c0caf5" >  Rerun of 'xelatex' forced or previously required:</tspan></text>
        <text x="0" y="220"><tspan fill="#c0caf5" >    Reason or flag: 'Initial setup'</tspan></text>
        <text x="0" y="240"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="260"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="280"><tspan fill="#c0caf5" >Run number 1 of rule 'xelatex'</tspan></text>
        <text x="0" y="300"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="320"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="340"><tspan fill="#565f89" >Running 'xelatex -no-pdf -halt-on-error -recorder</tspan></text>
        <text x="0" y="360"><tspan fill="#565f89" >    </tspan><tspan fill="#565f89" >-output-directory=&quot;junk&quot;  &quot;paper.tex&quot;'</tspan></text>
        <text x="0" y="380"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="400"><tspan fill="#c0caf5" >This is XeTeX, Version 3.141592653-2.6-0.999998 (TeX Live</tspan></text>
        <text x="0" y="420"><tspan fill="#c0caf5" >    </tspan><tspan fill="#c0caf5" >2026/Debian) (preloaded format=xelatex)</tspan></text>
        <text x="0" y="440"><tspan fill="#c0caf5" > restricted \write18 enabled.</tspan></text>
        <text x="0" y="460"><tspan fill="#c0caf5" >entering extended mode</tspan></text>
        <text x="0" y="480"><tspan fill="#c0caf5" >(./paper.tex</tspan></text>
        <text x="0" y="500"><tspan fill="#c0caf5" >LaTeX2e &lt;2026-06-01&gt;</tspan></text>
        <text x="0" y="520"><tspan fill="#c0caf5" >L3 programming layer &lt;2026-06-18&gt;</tspan></text>
        <text x="0" y="540"><tspan fill="#c0caf5" >(/usr/share/texlive/texmf-dist/tex/latex/base/article.cls</tspan></text>
        <text x="0" y="560"><tspan fill="#c0caf5" >Document Class: article 2025/01/22 v1.4n Standard LaTeX document</tspan></text>
        <text x="0" y="580"><tspan fill="#c0caf5" >    </tspan><tspan fill="#c0caf5" >class</tspan></text>
        <text x="0" y="600"><tspan fill="#c0caf5" >(/usr/share/texlive/texmf-dist/tex/latex/base/size10.clo))</tspan></text>
        <text x="0" y="620"><tspan fill="#c0caf5" >(/usr/share/texlive/texmf-dist/tex/latex/l3backend/l3backend-xetex.def)</tspan></text>
        <text x="0" y="640"><tspan fill="#c0caf5" >(junk/paper.aux)</tspan></text>
        <text x="0" y="660"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="680"><tspan fill="#c0caf5" >LaTeX Warning: Reference `fig:myfig' on page 1 undefined on input</tspan></text>
        <text x="0" y="700"><tspan fill="#c0caf5" >    </tspan><tspan fill="#c0caf5" >line 4.</tspan></text>
        <text x="0" y="720"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="740"><tspan fill="#c0caf5" >[1] (junk/paper.aux)</tspan></text>
        <text x="0" y="760"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="780"><tspan fill="#c0caf5" >LaTeX Warning: There were undefined references.</tspan></text>
        <text x="0" y="800"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="820"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="840"><tspan fill="#c0caf5" >LaTeX Warning: Label(s) may have changed. Rerun to get</tspan></text>
        <text x="0" y="860"><tspan fill="#c0caf5" >    </tspan><tspan fill="#c0caf5" >cross-references right.</tspan></text>
        <text x="0" y="880"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="900"><tspan fill="#c0caf5" > )</tspan></text>
        <text x="0" y="920"><tspan fill="#c0caf5" >Output written on junk/paper.xdv (1 page, 1292 bytes).</tspan></text>
        <text x="0" y="940"><tspan fill="#c0caf5" >Transcript written on junk/paper.log.</tspan></text>
        <text x="0" y="960"><tspan fill="#565f89" >Latexmk: Getting log file 'junk/paper.log'</tspan></text>
        <text x="0" y="980"><tspan fill="#565f89" >Latexmk: Examining 'junk/paper.fls'</tspan></text>
        <text x="0" y="1000"><tspan fill="#565f89" >Latexmk: Examining 'junk/paper.log'</tspan></text>
        <text x="0" y="1020"><tspan fill="#565f89" >Latexmk: References changed.</tspan></text>
        <text x="0" y="1040"><tspan fill="#565f89" >Latexmk: Log file says output to 'junk/paper.xdv'</tspan></text>
        <text x="0" y="1060"><tspan fill="#565f89" >Latexmk: applying rule 'xelatex'...</tspan></text>
        <text x="0" y="1080"><tspan fill="#565f89" >Rule 'xelatex':  Reasons for rerun</tspan></text>
        <text x="0" y="1100"><tspan fill="#565f89" >Changed files or newly in use/created:</tspan></text>
        <text x="0" y="1120"><tspan fill="#c0caf5" >  junk/paper.aux</tspan></text>
        <text x="0" y="1140"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="1160"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="1180"><tspan fill="#c0caf5" >Run number 2 of rule 'xelatex'</tspan></text>
        <text x="0" y="1200"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="1220"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="1240"><tspan fill="#565f89" >Running 'xelatex -no-pdf -halt-on-error -recorder</tspan></text>
        <text x="0" y="1260"><tspan fill="#565f89" >    </tspan><tspan fill="#565f89" >-output-directory=&quot;junk&quot;  &quot;paper.tex&quot;'</tspan></text>
        <text x="0" y="1280"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="1300"><tspan fill="#c0caf5" >This is XeTeX, Version 3.141592653-2.6-0.999998 (TeX Live</tspan></text>
        <text x="0" y="1320"><tspan fill="#c0caf5" >    </tspan><tspan fill="#c0caf5" >2026/Debian) (preloaded format=xelatex)</tspan></text>
        <text x="0" y="1340"><tspan fill="#c0caf5" > restricted \write18 enabled.</tspan></text>
        <text x="0" y="1360"><tspan fill="#c0caf5" >entering extended mode</tspan></text>
        <text x="0" y="1380"><tspan fill="#c0caf5" >(./paper.tex</tspan></text>
        <text x="0" y="1400"><tspan fill="#c0caf5" >LaTeX2e &lt;2026-06-01&gt;</tspan></text>
        <text x="0" y="1420"><tspan fill="#c0caf5" >L3 programming layer &lt;2026-06-18&gt;</tspan></text>
        <text x="0" y="1440"><tspan fill="#c0caf5" >(/usr/share/texlive/texmf-dist/tex/latex/base/article.cls</tspan></text>
        <text x="0" y="1460"><tspan fill="#c0caf5" >Document Class: article 2025/01/22 v1.4n Standard LaTeX document</tspan></text>
        <text x="0" y="1480"><tspan fill="#c0caf5" >    </tspan><tspan fill="#c0caf5" >class</tspan></text>
        <text x="0" y="1500"><tspan fill="#c0caf5" >(/usr/share/texlive/texmf-dist/tex/latex/base/size10.clo))</tspan></text>
        <text x="0" y="1520"><tspan fill="#c0caf5" >(/usr/share/texlive/texmf-dist/tex/latex/l3backend/l3backend-xetex.def)</tspan></text>
        <text x="0" y="1540"><tspan fill="#c0caf5" >(junk/paper.aux) [1] (junk/paper.aux) )</tspan></text>
        <text x="0" y="1560"><tspan fill="#c0caf5" >Output written on junk/paper.xdv (1 page, 1124 bytes).</tspan></text>
        <text x="0" y="1580"><tspan fill="#c0caf5" >Transcript written on junk/paper.log.</tspan></text>
        <text x="0" y="1600"><tspan fill="#565f89" >Latexmk: Getting log file 'junk/paper.log'</tspan></text>
        <text x="0" y="1620"><tspan fill="#565f89" >Latexmk: Examining 'junk/paper.fls'</tspan></text>
        <text x="0" y="1640"><tspan fill="#565f89" >Latexmk: Examining 'junk/paper.log'</tspan></text>
        <text x="0" y="1660"><tspan fill="#565f89" >Latexmk: Log file says output to 'junk/paper.xdv'</tspan></text>
        <text x="0" y="1680"><tspan fill="#565f89" >Latexmk: applying rule 'xdvipdfmx'...</tspan></text>
        <text x="0" y="1700"><tspan fill="#565f89" >Rule 'xdvipdfmx':  Reasons for rerun</tspan></text>
        <text x="0" y="1720"><tspan fill="#565f89" >Changed files or newly in use/created:</tspan></text>
        <text x="0" y="1740"><tspan fill="#c0caf5" >  junk/paper.xdv</tspan></text>
        <text x="0" y="1760"><tspan fill="#565f89" >Category 'changed_source_rules':</tspan></text>
        <text x="0" y="1780"><tspan fill="#c0caf5" >  xelatex</tspan></text>
        <text x="0" y="1800"><tspan fill="#565f89" >Category 'no_dest':</tspan></text>
        <text x="0" y="1820"><tspan fill="#c0caf5" >  xdvipdfmx</tspan></text>
        <text x="0" y="1840"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="1860"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="1880"><tspan fill="#c0caf5" >Run number 1 of rule 'xdvipdfmx'</tspan></text>
        <text x="0" y="1900"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="1920"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="1940"><tspan fill="#565f89" >Running 'xdvipdfmx -E -o &quot;junk/paper.pdf&quot;  &quot;junk/paper.xdv&quot;'</tspan></text>
        <text x="0" y="1960"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="1980"><tspan fill="#c0caf5" >junk/paper.xdv -&gt; junk/paper.pdf</tspan></text>
        <text x="0" y="2000"><tspan fill="#c0caf5" >[1]</tspan></text>
        <text x="0" y="2020"><tspan fill="#c0caf5" >6036 bytes written</tspan></text>
        <text x="0" y="2040"><tspan fill="#565f89" >Latexmk: All targets (junk/paper.xdv junk/paper.pdf) are up-to-date</tspan></text>
        <text x="0" y="2060"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="2080"><tspan fill="#565f89" >Running 'cp &quot;junk/&quot;&quot;paper&quot;.synctex.gz &quot;junk/&quot;&quot;paper&quot;.bbl </tspan></text>
        <text x="0" y="2100"><tspan fill="#565f89" >    </tspan><tspan fill="#565f89" >&quot;junk/&quot;&quot;paper&quot;.aux &quot;junk/&quot;&quot;paper&quot;.pdf  .'</tspan></text>
        <text x="0" y="2120"><tspan fill="#c0caf5" >------------</tspan></text>
        <text x="0" y="2140"><tspan fill="#c0caf5" >cp: cannot stat 'junk/paper.synctex.gz': No such file or directory</tspan></text>
        <text x="0" y="2160"><tspan fill="#c0caf5" >cp: cannot stat 'junk/paper.bbl': No such file or directory</tspan></text>
        <text x="0" y="2180"><tspan fill="#c0caf5" ></tspan></text>
  </g>
  <g transform="translate(18, 2272)">
    <rect width="540" height="32" rx="6" fill="#2d1c24" stroke="#f7768e" stroke-width="1.2"/>
    <text x="270" y="20" fill="#f7768e" text-anchor="middle" class="badge">❌ Silent exit 0! Cross-references secretly bind to section!</text>
  </g>
</g>

  <g transform="translate(640, 20)" filter="url(#shadow)">
