  <text x="288" y="25" fill="#c0caf5" text-anchor="middle" class="title">latex_it (l)</text>
  <g transform="translate(18, 62)" class="code">
    <text x="0" y="0"><tspan fill="#c0caf5" >$ l paper.tex</tspan></text>
        <text x="0" y="20"><tspan fill="#c0caf5" >      </tspan><tspan fill="#c0caf5" font-weight="bold">xelatex</tspan><tspan fill="#c0caf5" > (1)</tspan></text>
        <text x="0" y="40"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="60"><tspan fill="#c0caf5" >Overfull: 0 | Underfull: 0 | Bibtex warns/errors: 0 | Undef cite: 0</tspan></text>
        <text x="0" y="80"><tspan fill="#c0caf5" >    </tspan><tspan fill="#c0caf5" >| Undef refs: 0 | Lab multi-def: 0</tspan></text>
        <text x="0" y="100"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="120"><tspan fill="#f7768e" font-weight="bold">── </tspan><tspan fill="#c0caf5" font-weight="bold">paper.tex</tspan><tspan fill="#c0caf5" > (1 alert) </tspan><tspan fill="#f7768e" font-weight="bold">─────────────────────────────────────────────────────────</tspan></text>
        <text x="0" y="140"><tspan fill="#7dcfff" font-weight="bold">6</tspan><tspan fill="#f7768e" font-weight="bold">: </tspan><tspan fill="#f7768e" >Inverted \label{fig:myfig} before \caption in figure environment</tspan></text>
        <text x="0" y="160"><tspan fill="#c0caf5" ></tspan></text>
        <text x="0" y="180"><tspan fill="#9ece6a" font-weight="bold">Errors: 0</tspan><tspan fill="#c0caf5" >, </tspan><tspan fill="#f7768e" font-weight="bold">Alerts: 1</tspan><tspan fill="#c0caf5" >, </tspan><tspan fill="#9ece6a" font-weight="bold">Warnings: 0</tspan><tspan fill="#c0caf5" >, </tspan><tspan fill="#9ece6a" font-weight="bold">Whatevers: 0</tspan></text>
