<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 474" width="1240" height="474">
  <defs>
    <style>
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; line-height: 20px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; }
      .badge { font-family: ui-monospace, monospace; font-size: 11.5px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1240" height="474" rx="14" fill="#13141c"/>
  <g transform="translate(24, 20)" filter="url(#shadow)">
  <rect width="576" height="434" rx="10" fill="#1a1b26" stroke="#2f334d" stroke-width="1.5"/>
  <path d="M 0,10 A 10,10 0 0,1 10,0 L 566,0 A 10,10 0 0,1 576,10 L 576,40 L 0,40 Z" fill="#16161e"/>
  <circle cx="20" cy="20" r="6" fill="#f7768e"/>
  <circle cx="38" cy="20" r="6" fill="#e0af68"/>
  <circle cx="56" cy="20" r="6" fill="#414868"/>
  <text x="288" y="25" fill="#787c99" text-anchor="middle" class="title">Standard Tool: latexmk</text>
  <g transform="translate(18, 62)" class="code">
    <text x="0" y="0"><tspan fill="#7dcfff" font-weight="bold">$ latexmk -xelatex paper.tex</tspan></text>
        <text x="0" y="20"><tspan fill="#e0af68" font-weight="bold" font-size="15.5px">&lt;&lt;&lt; DELETED 90 LINES &gt;&gt;&gt;</tspan></text>
        <text x="0" y="40"><tspan fill="#c0caf5">LaTeX Warning: Reference `fig:myfig' on page 1 undefined on input</tspan></text>
        <text x="0" y="60"><tspan fill="#c0caf5">    </tspan><tspan fill="#c0caf5">line 4.</tspan></text>
        <text x="0" y="80"><tspan fill="#c0caf5">LaTeX Warning: There were undefined references.</tspan></text>
        <text x="0" y="100"><tspan fill="#c0caf5">LaTeX Warning: Label(s) may have changed. Rerun to get</tspan></text>
        <text x="0" y="120"><tspan fill="#c0caf5">    </tspan><tspan fill="#c0caf5">cross-references right.</tspan></text>
        <text x="0" y="140"><tspan fill="#c0caf5">Output written on junk/paper.xdv (1 page, 1292 bytes).</tspan></text>
        <text x="0" y="160"><tspan fill="#c0caf5">Output written on junk/paper.xdv (1 page, 1124 bytes).</tspan></text>
        <text x="0" y="180"><tspan fill="#565f89">Latexmk: All targets (junk/paper.xdv junk/paper.pdf) are up-to-date</tspan></text>
  </g>
  <g transform="translate(18, 392)">
    <rect width="540" height="32" rx="6" fill="#2d1c24" stroke="#f7768e" stroke-width="1.2"/>
    <text x="270" y="20" fill="#f7768e" text-anchor="middle" class="badge">❌ Silent exit 0! Cross-references secretly bind to section!</text>
  </g>
</g>

  <g transform="translate(640, 20)" filter="url(#shadow)">
  <rect width="576" height="434" rx="10" fill="#1a1b26" stroke="#384a68" stroke-width="1.5"/>
  <path d="M 0,10 A 10,10 0 0,1 10,0 L 566,0 A 10,10 0 0,1 576,10 L 576,40 L 0,40 Z" fill="#16161e"/>
  <circle cx="20" cy="20" r="6" fill="#f7768e"/>
  <circle cx="38" cy="20" r="6" fill="#e0af68"/>
  <circle cx="56" cy="20" r="6" fill="#9ece6a"/>
  <text x="288" y="25" fill="#c0caf5" text-anchor="middle" class="title">latex_it (l)</text>
  <g transform="translate(18, 62)" class="code">
    <text x="0" y="0"><tspan fill="#c0caf5">$ l paper.tex</tspan></text>
        <text x="0" y="20"><tspan fill="#c0caf5">      </tspan><tspan fill="#c0caf5" font-weight="bold">xelatex</tspan><tspan fill="#c0caf5"> (1)</tspan></text>
        <text x="0" y="40"><tspan fill="#c0caf5"></tspan></text>
        <text x="0" y="60"><tspan fill="#c0caf5">Overfull: 0 | Underfull: 0 | Bibtex warns/errors: 0 | Undef cite: 0</tspan></text>
        <text x="0" y="80"><tspan fill="#c0caf5">    </tspan><tspan fill="#c0caf5">| Undef refs: 0 | Lab multi-def: 0</tspan></text>
        <text x="0" y="100"><tspan fill="#c0caf5"></tspan></text>
        <text x="0" y="120"><tspan fill="#f7768e" font-weight="bold">── </tspan><tspan fill="#c0caf5" font-weight="bold">paper.tex</tspan><tspan fill="#c0caf5"> (1 alert) </tspan><tspan fill="#f7768e" font-weight="bold">─────────────────────────────────────────────────────────</tspan></text>
        <text x="0" y="140"><tspan fill="#7dcfff" font-weight="bold">6</tspan><tspan fill="#f7768e" font-weight="bold">: </tspan><tspan fill="#f7768e">Inverted \label{fig:myfig} before \caption in figure environment</tspan></text>
        <text x="0" y="160"><tspan fill="#c0caf5"></tspan></text>
        <text x="0" y="180"><tspan fill="#9ece6a" font-weight="bold">Errors: 0</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#f7768e" font-weight="bold">Alerts: 1</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#9ece6a" font-weight="bold">Warnings: 0</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#9ece6a" font-weight="bold">Whatevers: 0</tspan></text>
  </g>
  <g transform="translate(18, 392)">
    <rect width="540" height="32" rx="6" fill="#1c2d24" stroke="#9ece6a" stroke-width="1.2"/>
    <text x="270" y="20" fill="#9ece6a" text-anchor="middle" class="badge">✔ Alert tier warns of corrupted cross-reference before publishing!</text>
  </g>
</g>

</svg>
